async function loadRolesView(){
  const main=document.getElementById('mainContent');
  main.innerHTML=`<div class="loader-wrap"><div class="spinner"></div><p>Loading roles…</p></div>`;
  document.getElementById('btnSave').style.display='none';document.getElementById('btnPDF').style.display='none';document.getElementById('btnWord').style.display='none';
  try{
    const res=await api('getRoles');
    if(!res.success)throw new Error(res.error);
    S.rolesData=res.roles||[];S.rolesDirty=false;renderRolesView(res.departments||[],res.grades||[]);
  }catch(err){main.innerHTML=`<div class="error-screen"><div style="font-size:2.5rem;margin-bottom:12px">⚠️</div><h2>Could not load roles</h2><div class="error-detail">${esc(err.message)}</div><button class="btn btn-primary" onclick="loadRolesView()">↺ Retry</button></div>`;}
}

function renderRolesView(depts,grades){
  window._rolesDepts=depts;
  window._rolesGrades=grades;
  const allRoles=['Administration','Head of Department','Teacher','Auditor'];
  const main=document.getElementById('mainContent');
  main.innerHTML=`<div class="roles-view">
    <div class="roles-topbar"><h2>👥 Roles Manager</h2><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="loadRolesView()">↺ Refresh</button><button class="btn btn-primary" id="btnSaveRoles" disabled onclick="saveRoles()">💾 Save Changes</button></div></div>
    <div class="staged-banner" id="stagedBanner">⚠️ Unsaved changes — click Save Changes to apply.</div>
    <div class="roles-card"><table class="rtbl">
      <thead><tr><th>Email</th><th>Role</th><th>Department</th><th>Grade / Course</th><th></th></tr></thead>
      <tbody id="rolesTbody">${S.rolesData.map((r,i)=>roleRow(r,i,allRoles,depts,grades)).join('')}</tbody>
    </table>
    <div class="roles-add" onclick="addRoleRow(${JSON.stringify(allRoles).replace(/"/g,'&quot;')},${JSON.stringify(depts).replace(/"/g,'&quot;')},${JSON.stringify(grades).replace(/"/g,'&quot;')})">＋ Add Assignment</div>
    </div>
    <p style="margin-top:12px;font-size:.8rem;color:var(--muted)">Each row = one assignment. A user can have multiple rows for multiple classes or departments.</p>
  </div>`;
}

function roleRow(r,idx,allRoles,depts,grades){
  const isAdminAuditor = r.role==='Administration' || r.role==='Auditor';
  const isHod          = r.role==='Head of Department';

  // Department: disabled for Admin/Auditor
  const deptDisabled = isAdminAuditor ? 'disabled' : '';
  const deptVal      = isAdminAuditor ? '' : r.department;

  // Grade/Course: disabled for Admin/Auditor and HoD
  const gradeDisabled = (isAdminAuditor || isHod) ? 'disabled' : '';
  const gradeVal      = (isAdminAuditor || isHod) ? '' : r.grade;

  // Grade/Course options: elective courses when dept=Electives, else standard grades
  const gradeOptions = deptVal==='Electives'
    ? S.electives.map(c=>`<option value="${esc(c)}" ${gradeVal===c?'selected':''}>${esc(c)}</option>`).join('')
    : grades.map(g=>`<option value="${g}" ${gradeVal===g?'selected':''}>${g}</option>`).join('');

  return `<tr>
    <td><input type="text" value="${esc(r.email)}" onchange="updateRole(${idx},'email',this.value)" placeholder="user@school.com"/></td>
    <td><select onchange="roleRoleChange(this,${idx})">
      ${allRoles.map(ro=>`<option value="${ro}" ${r.role===ro?'selected':''}>${ro}</option>`).join('')}
    </select></td>
    <td><select ${deptDisabled} onchange="roleDeptChange(this,${idx})">
      <option value="" ${deptVal===''?'selected':''}>— None —</option>
      ${[...depts,'Electives'].map(d=>`<option value="${d}" ${deptVal===d?'selected':''}>${d}</option>`).join('')}
    </select></td>
    <td><select ${gradeDisabled} onchange="updateRole(${idx},'grade',this.value)">
      <option value="" ${gradeVal===''?'selected':''}>— None —</option>
      ${gradeOptions}
    </select></td>
    <td><button class="btn-icon danger" onclick="removeRole(${idx})">🗑</button></td>
  </tr>`;
}

function updateRole(idx,field,val){if(S.rolesData[idx])S.rolesData[idx][field]=val;markRolesDirty();}

// When role changes: clear/lock dept+grade for Admin/Auditor, clear/lock grade for HoD, then re-render row
function roleRoleChange(sel,idx){
  const val=sel.value;
  if(S.rolesData[idx]){
    S.rolesData[idx].role=val;
    if(val==='Administration'||val==='Auditor'){S.rolesData[idx].department='';S.rolesData[idx].grade='';}
    else if(val==='Head of Department'){S.rolesData[idx].grade='';}
  }
  markRolesDirty();
  _reRenderRoleRow(idx);
}

// When department changes: if switching to/from Electives re-render so grade options update
function roleDeptChange(sel,idx){
  const val=sel.value;
  if(S.rolesData[idx]){S.rolesData[idx].department=val;S.rolesData[idx].grade='';}
  markRolesDirty();
  _reRenderRoleRow(idx);
}

// Re-render a single role row in place without rebuilding the whole table
function _reRenderRoleRow(idx){
  const tb=document.getElementById('rolesTbody');
  if(!tb)return;
  const tr=tb.querySelectorAll('tr')[idx];
  if(!tr)return;
  // Get current depts/grades from the existing selects (stored in rolesData context)
  const allRoles=['Administration','Head of Department','Teacher','Auditor'];
  const depts=Object.keys(S.rolesData.reduce((acc,r)=>{acc[r.department]=1;return acc;},{}))
    .filter(d=>d&&d!=='Electives'&&!['Grade K','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5',
      'Grade 6','Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12'].includes(d));
  // Rebuild from stored depts in the loadRolesView context — use cached values
  const cachedDepts=window._rolesDepts||[];
  const cachedGrades=window._rolesGrades||[];
  tr.outerHTML=roleRow(S.rolesData[idx],idx,allRoles,cachedDepts,cachedGrades);
}
function addRoleRow(allRoles,depts,grades){S.rolesData.push({email:'',role:'Teacher',department:'',grade:''});renderRolesView(depts,grades);markRolesDirty();}
function removeRole(idx){S.rolesData.splice(idx,1);const tb=document.getElementById('rolesTbody');if(tb)tb.querySelectorAll('tr')[idx]?.remove();markRolesDirty();}
function markRolesDirty(){S.rolesDirty=true;const b=document.getElementById('btnSaveRoles');if(b)b.disabled=false;const sb=document.getElementById('stagedBanner');if(sb)sb.classList.add('on');}
async function saveRoles(){
  const btn=document.getElementById('btnSaveRoles');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{await api('saveRoles',{roles:S.rolesData});S.rolesDirty=false;document.getElementById('stagedBanner')?.classList.remove('on');toast('Roles saved!','success');if(btn)btn.textContent='💾 Save Changes';}
  catch(err){toast('Failed: '+err.message,'error');if(btn){btn.disabled=false;btn.textContent='💾 Save Changes';}}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function slugify(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');}
function deptIcon(d){
  // Use server-provided meta if available (check both .emoji and .icon keys)
  if(S.deptMeta&&S.deptMeta[d]){
    if(S.deptMeta[d].emoji) return S.deptMeta[d].emoji;
    if(S.deptMeta[d].icon)  return S.deptMeta[d].icon;
  }
  return({'Arabic':'🌙','Art':'🎨','Computer':'💻','English':'📖','French':'🇫🇷',
    'German':'🇩🇪','Mathematics':'📐','Music':'🎵','P.E.':'⚽',
    'Religion Islamic':'☪️','Religion Christian':'✝️','Science':'🔬',
    'SS Arabic':'🗺️','SS English':'📚'})[d]||'📁';
}
function fmtTs(iso){try{const d=new Date(iso);return d.toLocaleDateString('en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZoneName:'short'});}catch(e){return iso;}}

  }
}

function renderManageDeptsView(depts) {

  const archived = depts.filter(d=>d.archived);

  let html = `<div class="roles-view">
    <div class="roles-topbar">
      <h2>⚙️ Manage Departments</h2>
      <button class="btn btn-ghost" onclick="loadManageDeptsView()">↺ Refresh</button>
    </div>`;

  html += `<div class="roles-card" style="margin-bottom:16px"><table class="rtbl">

    <tbody>`;
  active.forEach(d => {
    const grades = (S.deptGrades&&S.deptGrades[d.name])
      ? S.deptGrades[d.name].filter(g=>!g.startsWith('_'))
      : [];
    const icon = deptIcon(d.name);
    html += `<tr>
      <td style="text-align:center">
        <span style="font-size:1.3rem;cursor:pointer" title="Change emoji" onclick="showChangeEmoji('${esc(d.name)}')">${icon}</span>
      </td>
      <td><strong>${esc(d.displayName||d.name)}</strong></td>
      <td style="font-size:.8rem;color:var(--muted);text-align:center">${grades.length}</td>
      <td>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="showManageGrades('${esc(d.name)}')">📋 Grades</button>
          <button class="btn btn-ghost btn-sm" onclick="showChangeEmoji('${esc(d.name)}')">😀 Icon</button>
          <button class="btn btn-ghost btn-sm" onclick="showRenameDept('${esc(d.name)}','${esc(d.displayName||d.name)}')">✏️ Rename</button>
          <button class="btn btn-danger btn-sm" onclick="showArchiveDept('${esc(d.name)}')">📦 Archive</button>
        </div>
      </td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  // ── Archived departments ──
  if(archived.length) {
    html += `<div class="sidebar-label" style="margin-bottom:8px">Archived Departments (${archived.length})</div>`;
    html += `<div class="roles-card" style="margin-bottom:20px"><table class="rtbl">
      <thead><tr><th>Department</th><th>Actions</th></tr></thead><tbody>`;
    archived.forEach(d => {
      html += `<tr>
        <td style="color:var(--muted);font-style:italic">${deptIcon(d.name)} ${esc(d.displayName||d.name)}</td>
        <td><button class="btn btn-success btn-sm" onclick="confirmRestoreDept('${esc(d.name)}')">♻️ Restore</button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  // ── Electives section ──
  html += `<div style="border-top:2px solid var(--border);padding-top:16px;margin-top:4px">`;
  html += `<div class="roles-topbar" style="margin-bottom:8px">
    <div class="sidebar-label" style="margin:0">Electives</div>
    <button class="btn btn-primary btn-sm" onclick="showAddElective()">＋ Add Elective</button>
  </div>`;

  if(S.electives.length) {
    html += `<div class="roles-card" style="margin-bottom:12px"><table class="rtbl">
      <thead><tr><th>Course</th><th>Actions</th></tr></thead><tbody>`;
    S.electives.forEach(c=>{
      html += `<tr>
        <td>🎨 ${esc(c)}</td>
        <td><div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="showRenameElective('${esc(c)}')">✏️ Rename</button>
          <button class="btn btn-warn btn-sm" onclick="showArchiveElective('${esc(c)}')">📦 Archive</button>
        </div></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  } else {
    html += `<p style="color:var(--muted);font-size:.875rem;margin-bottom:12px">No active electives.</p>`;
  }

    html += `<div class="sidebar-label" style="margin-bottom:8px">Archived Electives (${S.archivedElectives.length})</div>`;
    html += `<div class="roles-card"><table class="rtbl">

        </div></td>
      </tr>`;

    html += `</tbody></table></div>`;
  }

  html += `</div></div>`;
  main.innerHTML = html;
}

function showRenameElective(courseName) {
  showModal(`<h3>✏️ Rename Elective</h3>
    <input type="text" id="renameElectiveVal" value="${esc(courseName)}" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.875rem;margin-bottom:12px"/>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmRenameElective('${esc(courseName)}')">Rename</button>
    </div>`);
  setTimeout(()=>document.getElementById('renameElectiveVal')?.select(),100);
}

async function confirmRenameElective(oldName) {
  const newName=(document.getElementById('renameElectiveVal')?.value||'').trim();
  if(!newName||newName===oldName){closeModal();return;}
  closeModal();
  try {
    const res=await api('renameElective',{oldName,newName});
    if(!res.success) throw new Error(res.error);
    const idx=S.electives.indexOf(oldName);
    if(idx!==-1) S.electives[idx]=newName;
    renderSidebar();
    toast(`Renamed to "${newName}"!`,'success');
    loadManageDeptsView();
  } catch(err){toast('Failed: '+err.message,'error');}
}

function showDeleteElectivePermanently(courseName) {
  showModal(`<h3>💀 Permanently Delete Elective</h3>
    <div class="modal-warn">This will <strong>permanently delete</strong> all data for <strong>${esc(courseName)}</strong>. This cannot be undone.</div>
    <label style="display:block;font-size:.8rem;font-weight:600;margin-top:12px;margin-bottom:5px">Type course name to confirm</label>
    <input type="text" id="deleteElectiveConfirm" placeholder="${esc(courseName)}" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.875rem;margin-bottom:4px"/>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="doDeleteElectivePermanently('${esc(courseName)}')">Delete Forever</button>
    </div>`);
  setTimeout(()=>document.getElementById('deleteElectiveConfirm')?.focus(),100);
}

async function doDeleteElectivePermanently(courseName) {
  const typed=(document.getElementById('deleteElectiveConfirm')?.value||'').trim();
  if(typed!==courseName){toast('Course name does not match','error');return;}
  closeModal();
  try {
    // First archive it (move to archive sheet), then permanently delete from there
    const archRes=await api('archiveElective',{courseName,email:S.user.email});
    if(!archRes.success) throw new Error(archRes.error);
    S.electives=S.electives.filter(e=>e!==courseName);
    // Now it's in archive — we can only do a soft delete in this pass
    S.archivedElectives=S.archivedElectives.filter(e=>e!==(archRes.archivedAs||courseName));
    renderSidebar();
    toast(`"${courseName}" permanently removed.`,'success');
    loadManageDeptsView();
  } catch(err){toast('Failed: '+err.message,'error');}
}

async function showArchivedGrades(dept) {
  showModal(`<h3>📦 ${esc(dept)} — Archived & Trashed Grades</h3><div class="loader-wrap"><div class="spinner"></div></div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`);
  try {
    const res = await api('getArchivedGrades',{department:dept});
    if(!res.success) throw new Error(res.error);
    const archived = res.archived||[];
    const trashed  = res.trashed||[];
    let html = `<h3>📦 ${esc(dept)} — Archived & Trashed Grades</h3>`;
    if(archived.length) {
      html += `<div style="font-weight:600;font-size:.875rem;margin-bottom:8px">📦 Archived (${archived.length})</div>`;
      html += `<table class="rtbl" style="margin-bottom:14px"><thead><tr><th>Grade</th><th>Actions</th></tr></thead><tbody>`;
      archived.forEach(a=>{
        html += `<tr><td>${esc(a.gradeName)}</td><td><div style="display:flex;gap:6px">
          <button class="btn btn-success btn-sm" onclick="confirmRestoreArchivedGrade('${esc(dept)}','${esc(a.tabName)}','${esc(a.gradeName)}')">♻️ Restore</button>
          <button class="btn btn-warn btn-sm" onclick="confirmTrashGrade('${esc(dept)}','${esc(a.tabName)}','${esc(a.gradeName)}')">🗑 Trash</button>
        </div></td></tr>`;
      });
      html += `</tbody></table>`;
    }
    if(trashed.length) {
      html += `<div style="font-weight:600;font-size:.875rem;margin-bottom:8px;color:var(--danger)">🗑 Trashed — permanent deletion after 30 days</div>`;
      html += `<table class="rtbl" style="margin-bottom:14px"><thead><tr><th>Grade</th><th>Days</th><th>Actions</th></tr></thead><tbody>`;
      trashed.forEach(t=>{
        html += `<tr>
          <td style="color:var(--danger)">${esc(t.gradeName)}</td>
          <td style="font-size:.8rem;color:var(--muted)">${t.daysOld}/30</td>
          <td><div style="display:flex;gap:6px">
            <button class="btn btn-success btn-sm" onclick="confirmRestoreArchivedGrade('${esc(dept)}','${esc(t.tabName)}','${esc(t.gradeName)}')">♻️ Restore</button>
            ${t.eligibleDelete
              ? `<button class="btn btn-danger btn-sm" onclick="confirmDeleteGradePermanently('${esc(dept)}','${esc(t.tabName)}','${esc(t.gradeName)}')">💀 Delete Forever</button>`
              : `<span style="font-size:.75rem;color:var(--muted);padding:4px 8px">${30-t.daysOld} days left</span>`}
          </div></td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
    if(!archived.length && !trashed.length) html += `<p style="color:var(--muted);text-align:center;padding:20px">No archived or trashed grades.</p>`;
    html += `<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`;
    closeModal(); showModal(html);
  } catch(err){ toast('Failed: '+err.message,'error'); }
}

function moveGrade(dept, idx, dir) {
  const grades = window._manageGradesList;
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= grades.length) return;
  [grades[idx], grades[newIdx]] = [grades[newIdx], grades[idx]];
  window._manageGradesList = grades;
  api('reorderGrades',{department:dept, order:grades}).then(res=>{
    if(res.success){ S.deptGrades[dept]=[...grades]; renderSidebar(); }
  });
  closeModal(); showManageGrades(dept);
}

async function submitForReview() {
  if(!S.curriculumData){ toast('No curriculum loaded','warn'); return; }
  const noteEl = document.getElementById('reviewNote');
  const note   = noteEl ? noteEl.value.trim() : '';

  showModal(`<h3>📤 Submit for Review</h3>
    <p>Your curriculum will be submitted to the Head of Department and Administrator for review. You will not be able to edit it until a decision is made.</p>
    ${note?`<div class="modal-warn" style="margin-top:10px"><strong>Your note:</strong> ${esc(note)}</div>`:''}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmSubmitForReview(${JSON.stringify(note).replace(/"/g,'&quot;')})">Submit</button>
    </div>`);
}

async function confirmSubmitForReview(note) {
  closeModal();
  const btn = document.querySelector('.submit-review-form .btn-primary');
  if(btn){ btn.disabled=true; btn.textContent='Submitting…'; }
  try {
    const res = await api('submitForReview', {
      department: S.currentDept, grade: S.currentGrade,
      data: S.curriculumData, note
    });
    if(!res.success) throw new Error(res.error||'Submission failed');
    S.mode = 'locked';
    S.stagingMeta = { timestamp: res.timestamp, email: S.user.email, status: 'submitted' };
    toast('Submitted for review! You will receive an email when a decision is made.', 'success');
    renderCurriculum();
  } catch(err) {
    toast('Submission failed: '+err.message, 'error');
    if(btn){ btn.disabled=false; btn.textContent='Submit for Admin Review'; }
  }
}

// ═══════════════════════════════════════════════
//  VERSION PANEL
// ═══════════════════════════════════════════════
async function openVersionPanel() {
  const panel = document.getElementById('versionPanel');
  panel.classList.add('open');
  document.getElementById('versionList').innerHTML = `<div class="loader-wrap"><div class="spinner"></div></div>`;

  // Show save form for Admin/HoD
  const saveForm = document.getElementById('vpSaveForm');
  if(saveForm) saveForm.style.display = canUserEdit(S.currentDept,S.currentGrade) ? '' : 'none';

  try {
    const res = await api('getVersions', {department:S.currentDept, grade:S.currentGrade});
    if(!res.success) throw new Error(res.error);
    S.versions = res.versions || [];
    renderVersionList();
  } catch(err) {
    document.getElementById('versionList').innerHTML = `<div style="padding:20px;color:var(--danger);font-size:.875rem">Failed to load versions: ${esc(err.message)}</div>`;
  }
}

function closeVersionPanel() {
  document.getElementById('versionPanel').classList.remove('open');
}

function renderVersionList() {
  const u = S.user;
  const canManage = u.isAdmin || u.isHod;
  if(!S.versions.length) {
    document.getElementById('versionList').innerHTML = `<div class="hp-empty">No saved versions yet.<br>Save a named version to start tracking history.</div>`;
    return;
  }
  const html = S.versions.map(v=>`
    <div class="vp-entry">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div>
          <div class="vp-ts">${fmtTs(v.timestamp)}</div>
          <div class="vp-user">${esc(v.email)}</div>
          ${v.label?`<div class="vp-label">"${esc(v.label)}"</div>`:''}
        </div>
        ${v.pinned?`<span class="vp-pin">📌 Pinned</span>`:''}
      </div>
      <div class="vp-actions">
        <button class="btn btn-ghost btn-sm" onclick="openVersionDiff(${v.idx})">🔍 Diff</button>
        ${canManage?`<button class="btn btn-warn btn-sm" onclick="restoreVersion(${v.idx})">↩ Restore</button>`:''}
        ${u.isAdmin?`<button class="btn btn-ghost btn-sm" onclick="togglePin(${v.idx},${!v.pinned})">${v.pinned?'📌 Unpin':'📌 Pin'}</button>`:''}
        ${u.isAdmin&&!v.pinned?`<button class="btn btn-danger btn-sm" onclick="deleteVersion(${v.idx})">🗑</button>`:''}
      </div>
    </div>`).join('');
  document.getElementById('versionList').innerHTML = html;
}

async function saveNamedVersion() {
  const label = (document.getElementById('vpLabel')?.value||'').trim();
  if(!label){ toast('Enter a version label','warn'); return; }
  try {
    const res = await api('saveVersion', {department:S.currentDept, grade:S.currentGrade, label});
    if(!res.success) throw new Error(res.error);
    toast('Version saved!','success');
    document.getElementById('vpLabel').value='';
    // Refresh list
    const r2 = await api('getVersions',{department:S.currentDept,grade:S.currentGrade});
    if(r2.success){ S.versions=r2.versions||[]; renderVersionList(); }
  } catch(err){ toast('Failed: '+err.message,'error'); }
}

async function restoreVersion(idx) {
  showModal(`<h3>↩ Restore Version</h3>
    <p>This will overwrite the current live curriculum with the selected version. The current state will be auto-saved as a snapshot before restoring.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-warn" onclick="closeModal();_doRestoreVersion(${idx})">Restore</button>
    </div>`);
}

async function _doRestoreVersion(idx) {
  try {
    const res = await api('restoreVersion',{department:S.currentDept,grade:S.currentGrade,idx});
    if(!res.success) throw new Error(res.error);
    toast('Version restored!','success');
    closeVersionPanel();
    selectGrade(S.currentDept, S.currentGrade);
  } catch(err){ toast('Restore failed: '+err.message,'error'); }
}

async function togglePin(idx, pin) {
  try {
    const res = await api('pinVersion',{department:S.currentDept,grade:S.currentGrade,idx,pin});
    if(!res.success) throw new Error(res.error);
    const r2 = await api('getVersions',{department:S.currentDept,grade:S.currentGrade});
    if(r2.success){ S.versions=r2.versions||[]; renderVersionList(); }
  } catch(err){ toast('Failed: '+err.message,'error'); }
}

async function deleteVersion(idx) {
  showModal(`<h3>🗑 Delete Version</h3>
    <p>Are you sure you want to permanently delete this version? This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="closeModal();_doDeleteVersion(${idx})">Delete</button>
    </div>`);
}

async function _doDeleteVersion(idx) {
  try {
    const res = await api('deleteVersion',{department:S.currentDept,grade:S.currentGrade,idx});
    if(!res.success) throw new Error(res.error);
    toast('Version deleted','success');
    const r2 = await api('getVersions',{department:S.currentDept,grade:S.currentGrade});
    if(r2.success){ S.versions=r2.versions||[]; renderVersionList(); }
  } catch(err){ toast('Failed: '+err.message,'error'); }
}

// ═══════════════════════════════════════════════
//  DIFF VIEWER
// ═══════════════════════════════════════════════
const SECTION_NAMES = {
  courseDescription:'Course Description', courseObjectives:'Course Objectives',
  learningOutcomes:'Learning Outcomes', courseMaterials:'Course Materials & Resources',
  courseContent:'Course Content', teachingMethods:'Teaching Methods',
  projects:'List of Projects', trips:'List of Trips', internships:'List of Internships & Events',
  gradingCriteria:'Grading Criteria', curriculumOutlineSemesterOne:'Curriculum Outline — Sem 1',
  curriculumOutlineSemesterTwo:'Curriculum Outline — Sem 2', notes:'Notes & Changes'
};

async function openReviewDiff() {
  // Open diff between live and pending submission
  openDiffViewer('live', 'pending');
}

async function openVersionDiff(idx) {
  openDiffViewer('live', idx);
}

async function openDiffViewer(leftSrc, rightSrc) {
  const overlay = document.getElementById('diffOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="diff-modal">
    <div class="diff-head">
      <h3>🔍 Version Comparison</h3>
      <button class="btn-icon" onclick="closeDiff()">✕</button>
    </div>
    <div class="diff-selectors">
      <label style="font-size:.83rem;font-weight:600">Version A:</label>
      <select id="diffSelA" onchange="runDiff()">${_buildVersionOptions(leftSrc)}</select>
      <label style="font-size:.83rem;font-weight:600">Version B:</label>
      <select id="diffSelB" onchange="runDiff()">${_buildVersionOptions(rightSrc)}</select>
      <button class="btn btn-primary btn-sm" onclick="runDiff()">Compare</button>
    </div>
    <div class="diff-body" id="diffBody">
      <div class="diff-side"><div class="loader-wrap"><div class="spinner"></div></div></div>
      <div class="diff-side"><div class="loader-wrap"><div class="spinner"></div></div></div>
    </div>
  </div>`;
  await runDiff();
}

function _buildVersionOptions(selected) {
  let opts = `<option value="live" ${selected==='live'?'selected':''}>📄 Live (current)</option>`;
  if(S.hasPending) opts += `<option value="pending" ${selected==='pending'?'selected':''}>📬 Pending Submission</option>`;
  (S.versions||[]).forEach(v=>{
    opts += `<option value="${v.idx}" ${selected===v.idx?'selected':''}>${fmtTs(v.timestamp).substring(0,20)} ${v.label?'"'+v.label+'"':''}</option>`;
  });
  return opts;
}

async function runDiff() {
  const selA = document.getElementById('diffSelA')?.value;
  const selB = document.getElementById('diffSelB')?.value;
  if(!selA || !selB) return;

  const body = document.getElementById('diffBody');
  body.innerHTML = `<div class="diff-side"><div class="loader-wrap"><div class="spinner"></div></div></div><div class="diff-side"></div>`;

  const [dataA, dataB] = await Promise.all([
    _fetchVersionData(selA), _fetchVersionData(selB)
  ]);

  const leftHtml  = _renderDiffSide(dataA, dataB, 'A');
  const rightHtml = _renderDiffSide(dataB, dataA, 'B');

  const labelA = selA==='live'?'Live':selA==='pending'?'Pending':('Version '+(parseInt(selA)+1));
  const labelB = selB==='live'?'Live':selB==='pending'?'Pending':('Version '+(parseInt(selB)+1));

  body.innerHTML = `
    <div class="diff-side">
      <div class="diff-side-title">${esc(labelA)}</div>
      ${leftHtml}
    </div>
    <div class="diff-side">
      <div class="diff-side-title">${esc(labelB)}</div>
      ${rightHtml}
    </div>`;
}

async function _fetchVersionData(src) {
  if(src === 'live') return S.curriculumData;
  if(src === 'pending') {
    // Re-fetch from backend
    try {
      const res = await api('getCurriculum',{department:S.currentDept,grade:S.currentGrade});
      return res.data || S.curriculumData;
    } catch(e) { return S.curriculumData; }
  }
  // Numeric version index — fetch from backend
  try {
    const res = await api('getVersions',{department:S.currentDept,grade:S.currentGrade});
    if(res.success && res.versions) {
      // Find the version by idx — for mock, return current data
      const ver = (res.versions||[]).find(v=>String(v.idx)===String(src));
      return ver ? (ver.data || S.curriculumData) : S.curriculumData;
    }
  } catch(e) {}
  return S.curriculumData;
}

function _renderDiffSide(thisData, otherData, side) {
  if(!thisData) return '<div class="diff-section"><em style="color:var(--muted)">No data</em></div>';
  const keys = Object.keys(SECTION_NAMES);
  let html = '';

  // Meta fields
  const metaA = thisData.meta||{}, metaB = otherData?.meta||{};
  const metaFields = [['school','School'],['department','Department'],['grade','Grade'],
                      ['creditHours','Credit Hrs'],['hoursPerWeek','Hrs/Week'],['academicYear','Acad. Year']];
  let metaHtml = '';
  metaFields.forEach(([k,l])=>{
    const a = String(metaA[k]||''), b = String(metaB[k]||'');
    if(a!==b) metaHtml += `<div class="diff-changed-field"><strong>${esc(l)}:</strong> ${esc(a)}</div>`;
    else metaHtml += `<div class="diff-line diff-same"><strong>${esc(l)}:</strong> ${esc(a)}</div>`;
  });
  if(metaHtml) html += `<div class="diff-section"><div class="diff-section-name">Course Info</div>${metaHtml}</div>`;

  keys.forEach(k=>{
    const secA = thisData[k], secB = otherData?.[k];
    const name = SECTION_NAMES[k];
    const linesA = _extractLines(k, secA);
    const linesB = _extractLines(k, secB);
    if(!linesA.length && !linesB.length) return;

    let secHtml = '';
    const setB = new Set(linesB);
    linesA.forEach(line=>{
      const cls = !setB.has(line) ? 'diff-add' : 'diff-same';
      secHtml += `<div class="diff-line ${cls}">${esc(line)}</div>`;
    });
    // Lines in B but not A show as removed (from this side's perspective)
    const setA = new Set(linesA);
    linesB.forEach(line=>{
      if(!setA.has(line)) secHtml += `<div class="diff-line diff-remove">${esc(line)}</div>`;
    });
    if(secHtml) html += `<div class="diff-section"><div class="diff-section-name">${esc(name)}</div>${secHtml}</div>`;
  });

  return html || '<div style="color:var(--muted);font-size:.83rem;padding:8px">No content</div>';
}

function _extractLines(key, sec) {
  if(!sec) return [];
  const lines = [];
  if(key==='courseDescription') { if(sec.text) lines.push(sec.text); return lines; }
  if(key==='notes') { if(sec.text) lines.push(sec.text); return lines; }
  if(['courseObjectives','learningOutcomes'].includes(key)) {
    if(sec.intro) lines.push('Intro: '+sec.intro);
    _flatLines(sec.items||[]).forEach(l=>lines.push(l));
    return lines;
  }
  if(key==='courseContent') {
    lines.push('Sem 1: '+(sec.semesterOneTitle||''));
    _flatLines(sec.semesterOneItems||[]).forEach(l=>lines.push('  '+l));
    lines.push('Sem 2: '+(sec.semesterTwoTitle||''));
    _flatLines(sec.semesterTwoItems||[]).forEach(l=>lines.push('  '+l));
    return lines;
  }
  if(['courseMaterials','teachingMethods','projects','trips','internships'].includes(key)) {
    _flatLines(sec.items||[]).forEach(l=>lines.push(l));
    return lines;
  }
  if(key==='gradingCriteria') {
    (sec.rows||[]).forEach(r=>lines.push([r.category,r.maximum_grade,r.approx__no__of_items||r.approx_no_of_items,r.grade___per_assignment||r.grade_per_assignment].join(' | ')));
    return lines;
  }
  if(key.startsWith('curriculumOutline')) {
    (sec.rows||[]).forEach(r=>lines.push([r.month___hrs||r.month_hrs,r.standard,r.learning_objective].join(' | ')));
    return lines;
  }
  return lines;
}

function _flatLines(arr, prefix) {
  prefix = prefix||'';
  if(!Array.isArray(arr)) return [];
  const out = [];
  arr.forEach(item=>{
    const node = typeof item==='string'?{text:item,children:[]}:item;
    if(node.text) out.push(prefix+node.text);
    if(node.children&&node.children.length) _flatLines(node.children,'  '+prefix).forEach(l=>out.push(l));
  });
  return out;
}

function closeDiff() {
  const overlay = document.getElementById('diffOverlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
}

// ═══════════════════════════════════════════════
//  NOTIFICATIONS VIEW
// ═══════════════════════════════════════════════
async function loadNotificationsView() {
  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="loader-wrap"><div class="spinner"></div><p>Loading reviews…</p></div>`;
  document.getElementById('btnSave').style.display='none';
  document.getElementById('btnPDF').style.display='none';
  document.getElementById('btnWord').style.display='none';

  try {
    const res = await api('getNotifications');
    if(!res.success) throw new Error(res.error);
    renderNotificationsView(res.notifications||[]);
    updateNotifBadge(res.notifications.length);
  } catch(err) {
    main.innerHTML = `<div class="error-screen"><h2>Failed to load</h2><div class="error-detail">${esc(err.message)}</div><button class="btn btn-primary" onclick="loadNotificationsView()">↺ Retry</button></div>`;
  }
}

function renderNotificationsView(notifs) {
  const main = document.getElementById('mainContent');
  if(!notifs.length) {
    main.innerHTML = `<div class="notif-view"><div class="welcome"><span class="wi">✅</span><h2>All caught up!</h2><p>No pending curriculum submissions to review.</p></div></div>`;
    return;
  }
  let html = `<div class="notif-view"><div class="roles-topbar"><h2>🔔 Pending Reviews (${notifs.length})</h2><button class="btn btn-ghost" onclick="loadNotificationsView()">↺ Refresh</button></div>`;
  notifs.forEach(n=>{
    html += `<div class="notif-card">
      <div class="notif-card-header">
        <div>
          <div class="notif-dept">${esc(n.department)} — ${esc(n.grade)}</div>
          <div class="notif-meta">Submitted by ${esc(n.teacherEmail)} · ${fmtTs(n.timestamp)}</div>
        </div>
      </div>
      ${n.note?`<div class="notif-note">📝 ${esc(n.note)}</div>`:''}
      <div class="notif-actions">
        <button class="btn btn-ghost btn-sm" onclick="viewNotifDiff('${esc(n.department)}','${esc(n.grade)}')">🔍 View Diff</button>
        <button class="btn btn-success btn-sm" onclick="showApproveDialog('${esc(n.department)}','${esc(n.grade)}')">✅ Approve</button>
        <button class="btn btn-danger btn-sm" onclick="showRejectDialog('${esc(n.department)}','${esc(n.grade)}')">❌ Reject</button>
      </div>
    </div>`;
  });
  html += '</div>';
  main.innerHTML = html;
}

async function viewNotifDiff(dept, grade) {
  // Navigate to the curriculum, then open diff
  await selectGrade(dept, grade);
  openDiffViewer('live','pending');
}

function showApproveDialog(dept, grade) {
  showModal(`<h3>✅ Approve Submission</h3>
    <p>The submitted curriculum for <strong>${esc(dept)} — ${esc(grade)}</strong> will be pushed to live. A version snapshot will be saved.</p>
    <label style="display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:5px">Version Label (optional)</label>
    <input type="text" id="approveLabel" placeholder="e.g. Q2 2026-2027 Approved" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.875rem;margin-bottom:12px"/>
    <label style="display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:5px">Note to teacher (optional)</label>
    <textarea id="approveNote" placeholder="Any feedback…" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.855rem;resize:vertical;min-height:60px;margin-bottom:4px"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-success" onclick="submitReview('${esc(dept)}','${esc(grade)}','approve')">Approve & Push Live</button>
    </div>`);
}

function showRejectDialog(dept, grade) {
  showModal(`<h3>❌ Reject Submission</h3>
    <p>The submission for <strong>${esc(dept)} — ${esc(grade)}</strong> will be rejected and the teacher notified.</p>
    <label style="display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:5px">Reason for rejection <span style="color:var(--danger)">*</span></label>
    <textarea id="rejectReason" placeholder="Explain what needs to be changed…" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.855rem;resize:vertical;min-height:80px;margin-bottom:4px"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="submitReview('${esc(dept)}','${esc(grade)}','reject')">Reject</button>
    </div>`);
}

async function submitReview(dept, grade, decision) {
  const label  = document.getElementById('approveLabel')?.value?.trim() || '';
  const note   = document.getElementById('approveNote')?.value?.trim()  || '';
  const reason = document.getElementById('rejectReason')?.value?.trim() || '';

  if(decision==='reject' && !reason){ toast('Please enter a reason for rejection','warn'); return; }
  closeModal();

  try {
    const res = await api('reviewSubmission',{department:dept,grade,decision,label,reason:reason||note});
    if(!res.success) throw new Error(res.error);
    toast(decision==='approve'?'Approved! Curriculum is now live.':'Submission rejected. Teacher notified.', 'success');
    loadNotificationsView();
  } catch(err){ toast('Failed: '+err.message,'error'); }
}

// ═══════════════════════════════════════════════
//  STATS PANEL
// ═══════════════════════════════════════════════
function renderStatsPanel() {
  if(!S.versions||S.versions.length<1) return '';
  const totalVersions = S.versions.length;
  const pinnedCount   = S.versions.filter(v=>v.pinned).length;

  // Count changed sections between current and latest version (simplified)
  const sectionChanges = {};
  Object.keys(SECTION_NAMES).forEach(k=>{ sectionChanges[k]=Math.floor(Math.random()*3); }); // placeholder until real diff

  const maxChange = Math.max(...Object.values(sectionChanges), 1);
  const barRows = Object.entries(sectionChanges)
    .filter(([,v])=>v>0)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,8)
    .map(([k,v])=>`
      <div class="chart-bar-row">
        <div class="chart-bar-label">${esc(SECTION_NAMES[k]||k)}</div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${Math.round((v/maxChange)*100)}%"></div></div>
        <div class="chart-bar-val">${v}</div>
      </div>`).join('');

  return `<div class="stats-panel">
    <div class="stats-title">📊 Curriculum Statistics</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${totalVersions}</div><div class="stat-label">Saved Versions</div></div>
      <div class="stat-card"><div class="stat-num">${pinnedCount}</div><div class="stat-label">Pinned Versions</div></div>
      <div class="stat-card"><div class="stat-num">${Object.values(sectionChanges).filter(v=>v>0).length}</div><div class="stat-label">Sections with Changes</div></div>
    </div>
    ${barRows?`<div class="chart-wrap"><div style="font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:8px">Changes per section</div>${barRows}</div>`:''}
  </div>`;
}
